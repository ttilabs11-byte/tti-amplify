name: Keep Supabase awake

# Free Supabase projects pause after 7 idle days. One tiny read a day prevents that.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through the public API
        run: |
          curl -fsS "https://fuhnyjmbjzjflxylxakw.supabase.co/rest/v1/departments?select=id&limit=1" \
            -H "apikey: sb_publishable_X6ElDgI9IkOuELXgmDGKFw_v-J35WNq" > /dev/null
      # GitHub switches off scheduled workflows after 60 days without commits; a monthly heartbeat keeps this one on.
      - uses: actions/checkout@v4
      - name: Monthly heartbeat commit
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git config user.name "amplify-keepalive"
            git config user.email "actions@users.noreply.github.com"
            git add .heartbeat
            git commit -m "chore: monthly keepalive heartbeat"
            git push
          fi
